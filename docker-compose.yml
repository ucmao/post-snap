version: '3.8'

services:
  post-snap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: post-snap
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # 替换为你的服务器外网域名或局域网 IP
      - BASE_URL=http://localhost:3000
      - DEFAULT_IMAGE_STORAGE=local
      - MAX_IMAGE_SIZE_BYTES=10485760
      - REQUEST_TIMEOUT=15000
    volumes:
      - ./uploads:/app/uploads
